<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpeakDaily V2 · 自然美式男声</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0b1020;color:#f2f6ff;max-width:720px;margin:auto;padding:24px}h1{font-size:30px}p,.zh{color:#b4c0d5}.item{background:#19223a;border-radius:18px;padding:18px;margin:12px 0}.en{font-size:19px;font-weight:650;margin:7px 0}.zh{margin-bottom:14px}button{background:#9ce9cd;color:#081b1b;border:0;padding:12px 18px;border-radius:12px;font-weight:700}.hint{background:#24304c;padding:12px;border-radius:10px;font-size:14px}small{color:#9ce9cd}</style><h1>SpeakDaily <span style="color:#9ce9cd">V2</span></h1><p>20句 · Kokoro 自然美式男声 · am_michael</p><div class="hint" id="status">正在检查音频…</div><main id="list"></main><script>const data=[{"id":1,"en":"Hey, how's it going?","zh":"最近怎么样？"},{"id":2,"en":"Pretty good. How about you?","zh":"挺好的，你呢？"},{"id":3,"en":"What are you up to today?","zh":"你今天打算做什么？"},{"id":4,"en":"Not much, just taking it easy.","zh":"没什么，放松一下。"},{"id":5,"en":"Wanna grab a coffee?","zh":"要不要去喝杯咖啡？"},{"id":6,"en":"Sounds good to me.","zh":"听起来不错。"},{"id":7,"en":"Give me a second.","zh":"等我一下。"},{"id":8,"en":"I'll be right back.","zh":"我马上回来。"},{"id":9,"en":"Could you say that again?","zh":"能再说一遍吗？"},{"id":10,"en":"Could you speak a little more slowly?","zh":"能说慢一点吗？"},{"id":11,"en":"I didn't catch that.","zh":"我没听清。"},{"id":12,"en":"What do you recommend?","zh":"有什么推荐？"},{"id":13,"en":"Can I get an iced coffee, please?","zh":"请给我一杯冰咖啡。"},{"id":14,"en":"Could I have the check, please?","zh":"可以给我账单吗？"},{"id":15,"en":"Where's the nearest restroom?","zh":"最近的洗手间在哪里？"},{"id":16,"en":"How long does it take to get there?","zh":"到那里要多久？"},{"id":17,"en":"Is this seat taken?","zh":"这个座位有人吗？"},{"id":18,"en":"No worries. Take your time.","zh":"没关系，慢慢来。"},{"id":19,"en":"I'm just looking, thanks.","zh":"我先看看，谢谢。"},{"id":20,"en":"Thanks, I really appreciate it.","zh":"谢谢，真的很感谢。"}];let player=new Audio();document.querySelector('#list').innerHTML=data.map(x=>'<div class="item"><small>#'+String(x.id).padStart(2,'0')+'</small><div class="en">'+x.en+'</div><div class="zh">'+x.zh+'</div><button data-id="'+x.id+'">▶ 播放男声</button></div>').join('');document.querySelectorAll('button').forEach(b=>b.onclick=()=>{player.pause();player.src='audio/'+String(b.dataset.id).padStart(2,'0')+'.mp3';player.play().catch(()=>alert('音频尚未生成，请等待 GitHub Actions 生成完成。'));});fetch('audio/01.mp3',{method:'HEAD'}).then(r=>document.querySelector('#status').textContent=r.ok?'✓ AI 男声音频已就绪，点击下方播放':'音频尚未生成：请先运行 GitHub Actions 的 Generate Kokoro preview').catch(()=>document.querySelector('#status').textContent='无法检查音频，请稍后刷新');</script></html>
