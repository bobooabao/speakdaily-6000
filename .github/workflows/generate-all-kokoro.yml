name: Generate all 6000 Kokoro voices
on:
  push:
    paths:
      - '.github/workflows/generate-all-kokoro.yml'
      - 'scripts/generate_all_kokoro.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kokoro-audio-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
          pip install 'kokoro>=0.9.4,<1.0' soundfile numpy
      - name: Generate next batch
        env:
          BATCH_SIZE: '120'
        run: python scripts/generate_all_kokoro.py
      - name: Commit MP3 files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/*.mp3
          if ! git diff --cached --quiet; then
            git commit -m 'Generate next batch of Kokoro male audio'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
