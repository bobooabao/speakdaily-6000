name: Generate SpeakDaily Kokoro Voices
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    paths:
      - '.github/workflows/generate-quality-kokoro.yml'
      - 'scripts/generate_quality_kokoro.py'
permissions:
  contents: write
concurrency:
  group: speakdaily-quality-kokoro
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kokoro and MP3 encoder
        run: |
          sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
          pip install 'kokoro>=0.9.4,<1.0' soundfile numpy
      - name: Generate missing Kokoro voices
        env:
          BATCH_SIZE: '60'
        run: python scripts/generate_quality_kokoro.py
      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quality-v3/audio/
          if ! git diff --cached --quiet; then
            git commit -m "Generate next batch of Kokoro am_michael audio"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
