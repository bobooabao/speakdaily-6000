const key='speakdaily6000-v1';let saved=new Set(),settings={};try{saved=new Set(JSON.parse(localStorage.getItem(key+'-saved')||'[]'));settings=JSON.parse(localStorage.getItem(key+'-settings')||'{}')}catch(e){}
const persist=()=>{try{localStorage.setItem(key+'-saved',JSON.stringify([...saved]));localStorage.setItem(key+'-settings',JSON.stringify({voice:$('voice').value,rate:$('rate').value,pause:$('pause').value}))}catch(e){}};
function voices(){return window.speechSynthesis?.getVoices().filter(v=>/^en[-_]/i.test(v.lang))||[]}
function voiceOptions(){const prev=$('voice').value||settings.voice||'';const v=voices();$('voice').innerHTML='<option value="">系统默认英语</option>'+v.map(x=>`<option value="${encodeURIComponent(x.voiceURI)}">${escapeHtml(x.name)} · ${escapeHtml(x.lang)}</option>`).join('');$('voice').value=[...$('voice').options].some(o=>o.value===prev)?prev:''}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function filtered(){let q=$('search').value.trim().toLowerCase();return flat.filter(x=>(cat<0||x.cat===cat)&&($('mode').value!=='saved'||saved.has(x.id))&&(!q||x.en.toLowerCase().includes(q)||x.zh.includes(q)||String(x.id).includes(q)))}
function drawPills(){const opts=[{name:'全部场景'},...DATA];$('pills').innerHTML=opts.map((g,i)=>`<button class="pill ${cat===i-1?'on':''}" data-cat="${i-1}">${escapeHtml(g.name)}</button>`).join('');$('pills').querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=Number(b.dataset.cat);offset=0;stop();drawPills();render()})}
function render(){let a=filtered(),view=a.slice(0,offset+60);$('count').textContent=`${a.length.toLocaleString()} 句 · 已收藏 ${saved.size} 句`;$('list').innerHTML=view.map(x=>`<article class="card ${active===x.id?'active':''}" id="s${x.id}"><div class="content"><div class="num">#${String(x.id).padStart(4,'0')} · ${escapeHtml(DATA[x.cat].name)}</div><div class="en">${escapeHtml(x.en)}</div><div class="zh ${hideZh?'hidden':''}">${escapeHtml(x.zh)}</div></div><div class="actions"><button class="round ${saved.has(x.id)?'saved':''}" aria-label="收藏" data-save="${x.id}">${saved.has(x.id)?'★':'☆'}</button><button class="round play" aria-label="朗读" data-play="${x.id}">▶</button></div></article>`).join('');$('more').style.display=a.length>view.length?'block':'none';$('list').querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{let id=+b.dataset.save;saved.has(id)?saved.delete(id):saved.add(id);persist();render()});$('list').querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{let x=flat.find(v=>v.id===+b.dataset.play);stop();speak(x,false)})}
function speak(x,continuous){if(!window.speechSynthesis){$('state').textContent='此浏览器不支持语音朗读';return}active=x.id;$('now').textContent=x.en;$('state').textContent=`#${x.id} · ${DATA[x.cat].name}`;document.querySelectorAll('.card.active').forEach(c=>c.classList.remove('active'));document.getElementById('s'+x.id)?.classList.add('active');let t=token;let u=new SpeechSynthesisUtterance(x.en);u.lang='en-US';u.rate=Number($('rate').value);u.pitch=1;let v=voices().find(v=>encodeURIComponent(v.voiceURI)===$('voice').value);if(v)u.voice=v;u.onend=()=>{if(t!==token)return;if(continuous&&playing){timer=setTimeout(()=>{if(t===token)next()},Number($('pause').value))}else $('state').textContent='播放完成'};u.onerror=()=>{if(t===token){playing=false;$('toggle').textContent='▶ 连续播放';$('state').textContent='朗读中断，请重新点击'}};speechSynthesis.cancel();speechSynthesis.speak(u)}
function next(){if(!playing)return;if(cursor>=queue.length){stop();$('state').textContent='本轮播放完成';return}let x=queue[cursor++];speak(x,true)}
function stop(){token++;playing=false;clearTimeout(timer);window.speechSynthesis?.cancel();$('toggle').textContent='▶ 连续播放'}
$('toggle').onclick=()=>{if(playing){stop();return}queue=filtered();if(!queue.length)return;cursor=0;playing=true;$('toggle').textContent='Ⅱ 暂停播放';next()};
$('stop').onclick=()=>{stop();$('state').textContent='已停止'};
$('search').oninput=()=>{offset=0;stop();render()};$('mode').onchange=()=>{offset=0;stop();render()};$('hide').onclick=()=>{hideZh=!hideZh;$('hide').textContent=hideZh?'显示中文':'隐藏中文';render()};
$('more').onclick=()=>{offset+=60;render()};$('random').onclick=()=>{let a=filtered();if(!a.length)return;stop();speak(a[Math.floor(Math.random()*a.length)],false)};
['voice','rate','pause'].forEach(id=>$(id).onchange=persist);
$('rate').value=settings.rate||'1';$('pause').value=settings.pause||'1500';
voiceOptions();if(window.speechSynthesis)window.speechSynthesis.onvoiceschanged=voiceOptions;
drawPills();render();
</script></body></html>
