<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpeakDaily · 精选800句</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1220;color:#f7f8fc;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.wrap{max-width:800px;margin:auto;padding:24px 16px 110px}h1{font-size:29px;margin-bottom:4px}.muted{color:#a5b0c4;line-height:1.6}.tag{display:inline-block;color:#b7f98d;font-size:13px;margin:6px 0 18px}.toolbar{display:flex;gap:8px;position:sticky;top:0;background:#0d1220;padding:10px 0;z-index:2}select,input{background:#1b2538;color:white;border:1px solid #34425a;border-radius:12px;padding:12px;min-width:0}input{flex:1}.item{border:1px solid #303d51;background:#171f31;padding:17px;margin:11px 0;border-radius:16px}.item.active{border-color:#b7f98d}.scene{color:#b7f98d;font-size:12px}.en{font-size:19px;font-weight:650;line-height:1.5;margin:10px 0}.zh{color:#b5bfd0;margin:8px 0 14px}.play{border:0;background:#b7f98d;color:#12230c;border-radius:10px;padding:10px 17px;font-weight:750}.bar{position:fixed;bottom:0;left:0;right:0;background:#202b40;border-top:1px solid #34425a;padding:12px 18px;display:flex;gap:10px;justify-content:center;align-items:center}.bar button{background:#b7f98d;color:#14200b;border:0;border-radius:11px;padding:12px 20px;font-weight:700}.bar span{color:#c0cadd;font-size:12px;max-width:300px}</style></head><body><main class="wrap"><h1>SpeakDaily<span style="color:#b7f98d">.</span> 精选100句</h1><div class="tag">40个真实生活场景 · 质量优先 · 内容审核版</div><p class="muted">重新编写的实用美式日常表达，按场景学习。当前播放使用设备英语语音，尚不是 Kokoro 自然男声。</p><div class="toolbar"><select id="scene"><option value="">全部场景</option></select><input id="search" placeholder="搜索英文或中文"></div><div id="count" class="muted"></div><div id="list"></div></main><div class="bar"><span id="status">选择一句开始试听</span><button id="next">▶ 下一句</button></div><script>let DATA=[],current=-1;const $=x=>document.getElementById(x);function render(){const q=$('search').value.trim().toLowerCase(),scene=$('scene').value;let arr=DATA.filter(x=>(!scene||x.scene===scene)&&(!q||x.en.toLowerCase().includes(q)||x.zh.includes(q)));$('count').textContent='当前显示 '+arr.length+' 句';$('list').innerHTML=arr.map(x=>'<div class="item" id="s'+x.id+'"><div class="scene">#'+String(x.id).padStart(3,'0')+' · '+x.scene+'</div><div class="en">'+x.en.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</div><div class="zh">'+x.zh+'</div><button class="play" data-id="'+x.id+'">▶ 播放英语</button></div>').join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>play(+b.dataset.id))}function play(id){let x=DATA.find(x=>x.id===id);if(!x)return;current=id;document.querySelectorAll('.active').forEach(x=>x.classList.remove('active'));$('s'+id)?.classList.add('active');$('status').textContent='#'+id+' '+x.en;if(!window.speechSynthesis){$('status').textContent='浏览器不支持系统朗读';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(x.en);u.lang='en-US';u.rate=.9;let voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('en-us'));if(voices.length)u.voice=voices[0];speechSynthesis.speak(u)}$('next').onclick=()=>play(current>=DATA.length?1:current+1);Promise.all(['sentences.json','extra-01.json','extra-02.json','extra-03.json'].map(path=>fetch('./'+path).then(r=>{if(!r.ok)throw Error(path);return r.json()}))).then(groups=>{DATA=groups.flat().map((x,i)=>({...x,id:i+1}));[...new Set(d.map(x=>x.scene))].forEach(s=>{let o=document.createElement('option');o.value=s;o.textContent=s;$('scene').appendChild(o)});render()}).catch(()=>{$('count').textContent='加载句库失败，请刷新'});$('search').oninput=render;$('scene').onchange=render;</script></body></html>
