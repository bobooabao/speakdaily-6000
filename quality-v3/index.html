<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpeakDaily · 精选800句</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1220;color:#f7f8fc;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.wrap{max-width:800px;margin:auto;padding:24px 16px 110px}h1{font-size:29px;margin-bottom:4px}.muted{color:#a5b0c4;line-height:1.6}.tag{display:inline-block;color:#b7f98d;font-size:13px;margin:6px 0 18px}.toolbar{display:flex;gap:8px;position:sticky;top:0;background:#0d1220;padding:10px 0;z-index:2}select,input{background:#1b2538;color:white;border:1px solid #34425a;border-radius:12px;padding:12px;min-width:0}input{flex:1}.item{border:1px solid #303d51;background:#171f31;padding:17px;margin:11px 0;border-radius:16px}.item.active{border-color:#b7f98d}.scene{color:#b7f98d;font-size:12px}.en{font-size:19px;font-weight:650;line-height:1.5;margin:10px 0}.zh{color:#b5bfd0;margin:8px 0 14px}.play{border:0;background:#b7f98d;color:#12230c;border-radius:10px;padding:10px 17px;font-weight:750}.bar{position:fixed;bottom:0;left:0;right:0;background:#202b40;border-top:1px solid #34425a;padding:12px 18px;display:flex;gap:10px;justify-content:center;align-items:center}.bar button{background:#b7f98d;color:#14200b;border:0;border-radius:11px;padding:12px 20px;font-weight:700}.bar span{color:#c0cadd;font-size:12px;max-width:300px} .tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1;border:1px solid #34425a;background:#1b2538;color:#d5deed;padding:12px 8px;border-radius:12px;font-weight:650}.tabs button.on{background:#b7f98d;color:#10200b}.turn{padding:12px 0;border-top:1px solid #2d3950}.turn .en{font-size:17px;margin:6px 0}.turn .zh{margin:3px 0 8px}.turn .speaker{font-size:12px;color:#b7f98d;font-weight:800}.note{font-size:13px;color:#9daac2;margin-top:6px}.play.small{padding:7px 11px;font-size:12px}.item .turn:first-of-type{border-top:0} </style></head><body><main class="wrap"><h1>SpeakDaily<span style="color:#b7f98d">.</span> 日常英语 · 对话学习</h1><div class="tag">40组真实对话 · 40条高频口语 · 800句场景表达 · Kokoro 男声</div><p class="muted">Kokoro am_michael 自然美式男声正在自动分批生成。未生成的句子会显示提示，不再使用系统语音替代。</p><div class="tabs"><button id="tab-dialogue" class="on">情景对话</button><button id="tab-essentials">高频口语</button><button id="tab-sentences">单句学习</button></div><div class="toolbar"><select id="scene"><option value="">全部场景</option></select><input id="search" placeholder="搜索英文或中文"></div><div id="count" class="muted"></div><div id="list"></div></main><div class="bar"><span id="status">选择一句开始试听</span><button id="next">▶ 下一句</button></div><script>let DATA=[],DIALOGUES=[],ESSENTIALS=[],current=-1,mode='dialogue';const $=x=>document.getElementById(x);function render(){if(mode!=='sentences'){renderExtra();return}const q=$('search').value.trim().toLowerCase(),scene=$('scene').value;let arr=DATA.filter(x=>(!scene||x.scene===scene)&&(!q||x.en.toLowerCase().includes(q)||x.zh.includes(q)));$('count').textContent='当前显示 '+arr.length+' 句';$('list').innerHTML=arr.map(x=>'<div class="item" id="s'+x.id+'"><div class="scene">#'+String(x.id).padStart(3,'0')+' · '+x.scene+'</div><div class="en">'+x.en.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</div><div class="zh">'+x.zh+'</div><button class="play" data-id="'+x.id+'">▶ 播放英语</button></div>').join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>play(+b.dataset.id))}const kokoroAudio=new Audio();let playSeq=0;function playKokoro(key,en){const seq=++playSeq;window.speechSynthesis?.cancel();kokoroAudio.pause();kokoroAudio.src='./audio/'+key+'.mp3';$('status').textContent='Kokoro 男声 · '+en;kokoroAudio.onerror=()=>{if(seq===playSeq)$('status').textContent='该句 Kokoro 音频生成中，请稍后重试'};kokoroAudio.play().catch(()=>{if(seq===playSeq)$('status').textContent='音频尚未就绪或播放受限，请稍后重试'})}function speakText(en){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(en);u.lang='en-US';u.rate=.9;const vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('en-us'));if(vs.length)u.voice=vs[0];speechSynthesis.speak(u)}function renderExtra(){const q=$('search').value.trim().toLowerCase(),scene=$('scene').value;const arr=(mode==='dialogue'?DIALOGUES:ESSENTIALS).filter(x=>(!scene||x.scene===scene)&&(!q||(mode==='dialogue'?x.turns.some(t=>t.en.toLowerCase().includes(q)||t.zh.includes(q)):x.en.toLowerCase().includes(q)||x.zh.includes(q))));$('count').textContent=(mode==='dialogue'?'情景对话 ':'高频口语 ')+arr.length+(mode==='dialogue'?' 组':' 条');$('list').innerHTML=arr.map(x=>mode==='dialogue'?'<article class="item"><div class="scene">'+x.scene+'</div>'+x.turns.map((t,j)=>'<div class="turn"><div class="speaker">'+t.speaker+'</div><div class="en">'+esc(t.en)+'</div><div class="zh">'+esc(t.zh)+'</div><button class="play small" data-say="'+encodeURIComponent(t.en)+'">▶ 跟读</button></div>').join('')+'</article>':'<article class="item"><div class="en">'+esc(x.en)+'</div><div class="zh">'+esc(x.zh)+'</div><div class="note">'+esc(x.note)+'</div><button class="play small" data-say="'+encodeURIComponent(x.en)+'">▶ 跟读</button></article>').join('');document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>playKokoro(b.dataset.key,decodeURIComponent(b.dataset.say)))}function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function play(id){let x=DATA.find(x=>x.id===id);if(!x)return;current=id;playKokoro('s'+String(id).padStart(4,'0'),x.en);document.querySelectorAll('.active').forEach(x=>x.classList.remove('active'));$('s'+id)?.classList.add('active');$('status').textContent='#'+id+' '+x.en;}$('next').onclick=()=>play(current>=DATA.length?1:current+1);Promise.all(['sentences.json','extra-01.json','extra-02.json','extra-03.json','dialogues.json','essentials.json'].map(path=>fetch('./'+path).then(r=>{if(!r.ok)throw Error(path);return r.json()}))).then(groups=>{DIALOGUES=groups[4];ESSENTIALS=groups[5];DATA=groups.slice(0,4).flat().map((x,i)=>({...x,id:i+1}));[...new Set([...DATA.map(x=>x.scene),...DIALOGUES.map(x=>x.scene)])].forEach(s=>{let o=document.createElement('option');o.value=s;o.textContent=s;$('scene').appendChild(o)});render()}).catch(()=>{$('count').textContent='加载句库失败，请刷新'});[['tab-dialogue','dialogue'],['tab-essentials','essentials'],['tab-sentences','sentences']].forEach(([id,value])=>$(id).onclick=()=>{mode=value;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));$(id).classList.add('on');$('scene').value='';$('scene').style.display=mode==='essentials'?'none':'';$('next').style.display=mode==='sentences'?'':'none';render()});$('next').style.display='none';$('search').oninput=render;$('scene').onchange=render;</script></body></html>
