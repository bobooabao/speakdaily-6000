name: Generate SpeakDaily Kokoro Voices
on:
  workflow_dispatch:
  schedule:
    - cron: '11,31,51 * * * *'
  push:
    paths:
      - '.github/workflows/generate-quality-kokoro.yml'
      - 'scripts/generate_quality_kokoro.py'
permissions:
  contents: write
  actions: write
concurrency:
  group: speakdaily-quality-kokoro
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check audio completion
        id: check
        run: python scripts/generate_quality_kokoro.py --status >> "$GITHUB_OUTPUT"
      - name: Install Kokoro and MP3 encoder
        if: steps.check.outputs.pending != '0'
        run: |
          sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
          pip install 'kokoro>=0.9.4,<1.0' soundfile numpy
      - name: Continuously generate and checkpoint audio
        if: steps.check.outputs.pending != '0'
        env:
          BATCH_SIZE: '30'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          deadline=$((SECONDS + 18600))
          while (( SECONDS < deadline )); do
            status=$(python scripts/generate_quality_kokoro.py --status)
            printf '%s\n' "$status"
            pending=$(printf '%s\n' "$status" | sed -n 's/^pending=//p')
            if [ "$pending" = "0" ]; then
              echo "All audio files are ready."
              break
            fi
            # Save partial work even if the generation command fails.
            python scripts/generate_quality_kokoro.py || echo "Batch failed; checkpointing successful files and retrying on next scheduled run."
            git add quality-v3/audio/
            if ! git diff --cached --quiet; then
              git commit -m "Generate Kokoro am_michael audio checkpoint"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
            sleep 2
          done
      - name: Verify final completion
        id: finish
        if: always()
        run: |
          if [ -f scripts/generate_quality_kokoro.py ]; then
            python scripts/generate_quality_kokoro.py --status | tee /tmp/audio-status
            cat /tmp/audio-status >> "$GITHUB_OUTPUT"
          fi
      - name: Stop scheduled generation after completion
        if: steps.finish.outputs.pending == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "All Kokoro files are complete. Disabling this workflow's future schedules."
          gh api --method PUT "repos/${{ github.repository }}/actions/workflows/generate-quality-kokoro.yml/disable" || echo "Automatic disable unavailable; future checks will be no-op."
